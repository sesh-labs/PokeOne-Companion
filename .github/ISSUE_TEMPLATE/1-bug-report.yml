name: Bug report
description: Something in the app broke, didn't save, or behaved strangely.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Thanks for testing! Please don't include anything private. Other invited testers can see reports."
  - type: textarea
    id: doing
    attributes:
      label: What were you doing?
      description: Which screen were you on, and what did you click or type?
      placeholder: "On the Team page I added a Pikachu, set its level to 20, then closed the app."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What actually happened?
      description: If there was an error message, copy it here. You can also paste screenshots (Windows + Shift + S takes one).
    validations:
      required: true
  - type: dropdown
    id: repeatable
    attributes:
      label: Does it happen again if you repeat the same steps?
      options: ["Yes, every time", "Sometimes", "It only happened once", "I haven't tried"]
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostic information
      description: "In the app: Settings → Feedback & bug reports → Copy diagnostic information, then paste here (Ctrl + V)."
      render: text
    validations:
      required: true
