name: Bug report
description: Something in the app broke, didn't save, or behaved strangely.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Thanks for testing. Anyone can read this, so leave out anything private."
  - type: textarea
    id: doing
    attributes:
      label: What were you doing?
      description: Which screen were you on, and what did you click or type?
      placeholder: "On the Team page I added a Pikachu, set its level to 20, then closed the app."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What actually happened?
      description: Copy any error message here. Screenshots help (Windows + Shift + S). Crop them to the app window, since the taskbar or file paths can show your name.
    validations:
      required: true
  - type: dropdown
    id: repeatable
    attributes:
      label: Does it happen again if you repeat the same steps?
      options: ["Yes, every time", "Sometimes", "It only happened once", "I haven't tried"]
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostic information
      description: "In the app, Settings → Feedback & bug reports → Copy diagnostic information, then paste it here. If the app won't open, just say so and whether you have Windows 10 or 11."
      render: text
    validations:
      required: true
