name: I know the answer
description: Answer one of the open questions, the things the official site doesn't say.
title: "[Answer] "
labels: ["answer"]
body:
  - type: markdown
    attributes:
      value: "Thanks for checking. The game is always right. Anyone can read this, so leave out anything private."
  - type: input
    id: question
    attributes:
      label: Question id
      description: The code at the start of the line in the open questions list.
      placeholder: "e.g. BOSS-WHEN-mewtwo"
    validations:
      required: true
  - type: textarea
    id: seen
    attributes:
      label: What did you see in the game?
      description: Just what you saw. For a place, say which Pokémon you found and which you looked for but didn't.
      placeholder: "Dr. Tapps let me fight Mewtwo again the day after the reset."
    validations:
      required: true
  - type: dropdown
    id: sure
    attributes:
      label: How sure are you?
      options: ["I saw it just now", "I remember it from before", "I'm not sure"]
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot (optional)
      description: Paste one here (Windows + Shift + S). Crop it to the game window and hide your name and other players' names.
  - type: input
    id: where
    attributes:
      label: Region and place (optional)
      placeholder: "e.g. Kanto, Route 2"
