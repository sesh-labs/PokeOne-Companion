name: I know the answer
description: Answer one of the open questions (things the official site doesn't say or contradicts itself about).
title: "[Answer] "
labels: ["answer"]
body:
  - type: markdown
    attributes:
      value: "Thanks for checking in game! In PokéOne, **the game is always right**. Please don't include anything private: other invited testers can see answers."
  - type: input
    id: question
    attributes:
      label: Question id
      description: Copy it from the Open questions list (the bold code at the start of the line).
      placeholder: "e.g. BOSS-WHEN-mewtwo"
    validations:
      required: true
  - type: textarea
    id: seen
    attributes:
      label: What did you see in the game?
      description: Just what you saw. For a place, say which Pokémon you saw, and which you looked for and didn't find.
      placeholder: "Dr. Tapps let me fight Mewtwo again the day after the reset."
    validations:
      required: true
  - type: dropdown
    id: sure
    attributes:
      label: How sure are you?
      options: ["I saw it just now", "I remember it from before", "I'm not sure"]
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot (optional)
      description: Paste one here (Windows + Shift + S takes one). Crop it to the game window, because taskbars, other windows and file paths can show your name. Never show your name or other players' names.
  - type: input
    id: where
    attributes:
      label: Region and place (optional)
      placeholder: "e.g. Kanto, Route 2"
