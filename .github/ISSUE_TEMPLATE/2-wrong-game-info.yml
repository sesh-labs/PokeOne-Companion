name: Wrong or missing game information
description: The app shows something different from what PokéOne shows (spawns, levels, items, NPCs, gyms…).
title: "[Game data] "
labels: ["game data"]
body:
  - type: markdown
    attributes:
      value: "In PokéOne, **the game is always right**. These reports help keep the companion accurate."
  - type: input
    id: where
    attributes:
      label: Which Pokémon, place, item, move or NPC?
      placeholder: "e.g. Route 3, Headbutt spawns"
    validations:
      required: true
  - type: textarea
    id: app
    attributes:
      label: What the app shows
    validations:
      required: true
  - type: textarea
    id: game
    attributes:
      label: What the game actually shows
      description: A screenshot from the game helps a lot.
    validations:
      required: true
  - type: dropdown
    id: sure
    attributes:
      label: How sure are you?
      options: ["I saw it myself in the game", "I saw it once but I'm not certain", "Someone told me / I read it elsewhere"]
    validations:
      required: true
